[project]
name = "neo4r-client"
version = "0.1.0"
description = "Blocking Python client SDK for neo4r native protocol"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["neo4r_client*"]
