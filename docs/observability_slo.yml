version: 1
slo:
  native_query_p99_ms: 250
  web_query_p99_ms: 500
  raft_no_leader_max_seconds: 30
  replication_lag_max_entries: 100
  backup_restore_drill_max_age_hours: 24
required_metrics:
  - neo4r_http_requests_total
  - neo4r_queries_total
  - neo4r_raft_group_leaders
  - neo4r_database_shard_lag
  - neo4r_raft_append_conflicts_total
  - neo4r_slow_queries_total
  - neo4r_web_audit_events
  - neo4r_query_plan_cost_model_version
validation:
  scrape_smoke: required
  alert_rule_presence: required
  slo_metric_presence: required
