groups:
  - name: neo4r-operational-alerts
    rules:
      - alert: Neo4rRaftNoLeader
        expr: neo4r_raft_group_leaders == 0
        for: 30s
        labels:
          severity: page
        annotations:
          summary: "Neo4r Raft group has no leader"
      - alert: Neo4rShardReplicationLag
        expr: neo4r_database_shard_lag > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Neo4r shard replication lag is high"
      - alert: Neo4rAuthRateLimitSpike
        expr: increase(neo4r_auth_rate_limited_total[5m]) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Neo4r web auth is rate limiting frequently"
      - alert: Neo4rRestoreMaintenanceStuck
        expr: neo4r_http_errors_total > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Neo4r may be stuck in restore maintenance or rejecting traffic"
      - alert: Neo4rAppendConflicts
        expr: increase(neo4r_raft_append_conflicts_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Neo4r Raft append conflicts were observed"
      - alert: Neo4rStorageRepairFailures
        expr: increase(neo4r_storage_repair_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Neo4r storage repair failures were observed"
      - alert: Neo4rSloBurnRateHigh
        expr: neo4r_slo_burn_rate_ppm > 1000000 or neo4r_slo_query_error_rate_ppm > 10000 or neo4r_slo_replication_lag_entries > 100
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Neo4r SLO burn rate is above the production threshold"
