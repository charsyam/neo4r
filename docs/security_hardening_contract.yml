version: 1
required_controls:
  - token-digest-only
  - token-expiry
  - token-revoke
  - per-database-roles
  - db-action-resource-grant
  - rbac-grant-revoke-audit-reason
  - audit-retention
  - auth-rate-limit
  - operational-confirmation-token
  - tls-native
  - tls-replication
  - tls-web-admin
roles:
  reader:
    allows:
      - graph-read
      - query-plan
      - metrics-read
    denies:
      - mutating-query
      - backup
      - restore
      - tenant-admin
      - raft-admin
  writer:
    allows:
      - graph-read
      - mutating-query
    denies:
      - backup
      - restore
      - tenant-admin
      - raft-admin
  admin:
    allows:
      - graph-read
      - mutating-query
      - backup
      - restore
      - tenant-admin
      - raft-admin
      - repair-admin
      - rbac-grant
      - rbac-revoke
deny_by_default: true
required_checks:
  - rbac-role-boundary
  - rbac-grant-revoke-audit
  - destructive-operation-confirmation
policy_document: docs/rbac_policy.md
