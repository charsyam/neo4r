server:
  bind: 127.0.0.1:7687
  data_dir: data/server-1
  server_id: 1
  primary_server_id: 1

database:
  shards: 4
  partitions: 8

replication:
  bind: 10.255.175.1:9700
  transport: rdma
  ack: quorum
  connect_timeout_ms: 1000
  retry_attempts: 3
  retry_backoff_ms: 25
  peers:
    - server_id: 2
      address: 10.255.175.2:9700
      role: replica
  catch_up_on_startup: true
  catch_up_interval_ms: 1000
  catch_up_batch_size: 128

maintenance:
  sync_index_catalog_on_startup: true
  sync_index_catalog_interval_ms: 2000
  recover_transactions_on_startup: true
  recover_transactions_interval_ms: 3000

web:
  bind: 127.0.0.1:7474
  slow_query_threshold_ms: 250
