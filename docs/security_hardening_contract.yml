version: 1
required_controls:
  - token-digest-only
  - token-expiry
  - token-revoke
  - per-database-roles
  - audit-retention
  - auth-rate-limit
  - tls-native
  - tls-replication
  - tls-web-admin
roles:
  reader:
    allows:
      - graph-read
      - query-plan
      - metrics-read
    denies:
      - mutating-query
      - backup
      - restore
      - tenant-admin
      - raft-admin
  writer:
    allows:
      - graph-read
      - mutating-query
    denies:
      - backup
      - restore
      - tenant-admin
      - raft-admin
  admin:
    allows:
      - graph-read
      - mutating-query
      - backup
      - restore
      - tenant-admin
      - raft-admin
      - repair-admin
deny_by_default: true
required_checks:
  - rbac-role-boundary
policy_document: docs/rbac_policy.md
