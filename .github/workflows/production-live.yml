name: production-live

on:
  workflow_dispatch:
    inputs:
      run_object_storage:
        description: Run S3-compatible backup/restore E2E
        required: false
        default: "false"
      run_chaos:
        description: Run multi-node chaos/longevity gate
        required: false
        default: "false"

jobs:
  production-live:
    runs-on: ubuntu-latest
    services:
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: neo4r
          MINIO_ROOT_PASSWORD: neo4r-secret
        ports:
          - 9000:9000
        options: server /data
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Production static gates
        run: scripts/release-gate.sh
      - name: Object storage E2E
        if: inputs.run_object_storage == 'true'
        env:
          NEO4R_RUN_OBJECT_STORAGE_E2E: "1"
          NEO4R_RUN_OBJECT_STORAGE_SMOKE: "1"
          NEO4R_S3_ENDPOINT: http://127.0.0.1:9000
          NEO4R_S3_BUCKET: neo4r-ci
          NEO4R_S3_ACCESS_KEY: neo4r
          NEO4R_S3_SECRET_KEY: neo4r-secret
        run: scripts/object-storage-e2e.sh
      - name: Chaos longevity
        if: inputs.run_chaos == 'true'
        env:
          NEO4R_RUN_CHAOS_LONGEVITY: "1"
          NEO4R_RUN_MULTI_NODE_LIVE: "1"
        run: scripts/production-chaos-longevity-gate.sh
